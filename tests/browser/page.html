<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>code-editor</title>
    <style>
      body { margin: 0; padding: 16px; font-family: system-ui, sans-serif; }
      .host { height: 240px; width: 600px; border: 1px solid #d0d7de; }
    </style>
  </head>
  <body>
    <div id="host" class="host"></div>
    <dsk-code-editor id="element" class="host" language="typescript"><script type="text/plain">const a = '<b>not markup</b>'
const b = 2
</script></dsk-code-editor>
    <script type="module">
      import * as api from '/src/index.ts'
      api.defineCodeEditor()
      window.api = api
      window.changes = 0
      window.make = (options) => {
        window.ed?.destroy()
        window.ed = new api.CodeEditor(document.getElementById('host'), { ...options, onChange: () => window.changes++ })
        return window.ed.dom.dataset.input
      }
      window.ready = true
    </script>
  </body>
</html>
